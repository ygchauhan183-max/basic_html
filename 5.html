<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORMS</title>
</head>
<style>
    /* ===== Professional color palette ===== */
    :root {
        --bg: #f3f5f9;
        /* page background: light grey-blue */
        --card: #ffffff;
        /* form card */
        --text: #1f2937;
        /* main text: dark slate */
        --muted: #6b7280;
        /* placeholder / secondary text */
        --border: #d1d5db;
        /* input borders */
        --primary: #1e3a8a;
        /* navy blue: heading + button */
        --primary-dark: #172e6e;
        /* button hover */
        --focus: rgba(30, 58, 138, 0.2);
    }

    * {
        box-sizing: border-box;
        background-color: #86c3e0;
    }

    body {
        margin: 0;
        padding: 40px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        line-height: 1.5;
    }

    h1 {
        display: flex;
        align-items: center;
        text-align: center;
        /* border-radius: 20px; */
        font-size: 1.75rem;
        color: var(--primary);
        margin: 0 0 24px;
        width: 100px;
    }

    form {
        max-width: 480px;
        margin: 0 auto;
        padding: 32px;
        background: var(--card);
        border: 1px solid var(--border);
        border-top: 4px solid var(--primary);
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    form>div {
        margin-bottom: 18px;
    }

    label,
    form p {
        display: block;
        margin: 0 0 6px;
        font-weight: 600;
        font-size: 0.95rem;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        transition: border-color 0.15s, box-shadow 0.15s;
    }

    textarea {
        resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
        color: var(--muted);
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--focus);
    }

    /* Radio buttons and checkbox */
    input[type="radio"],
    input[type="checkbox"] {
        accent-color: var(--primary);
        width: 16px;
        height: 16px;
        margin: 0 4px 0 0;
        vertical-align: middle;
    }

    input[type="radio"]+label,
    input[type="checkbox"]+label {
        display: inline;
        margin-right: 16px;
        font-weight: 400;
    }

    button {
        width: 100%;
        padding: 12px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--primary);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.15s;
    }

    button:hover {
        background: var(--primary-dark);
    }

    button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
    }
</style>

<body>
    <h1>Form in html</h1>
    <form action="/submit.php">
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enter Name" required>
        </div>
        <div>
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div>
            <label for="Phone">Phone</label>
            <input id="Phone" type="tel" placeholder="Enter Phone" required>
        </div>
        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="Enter Email" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter Password" required>
        </div>
        <div>
            <label for="dob">Date of Birth</label>
            <input id="dob" type="date" required>
        </div>
        <div>
            <p>Subscription Plan</p>
            <input id="basic" type="radio" name="subscription" value="basic">
            <label for="basic">Basic</label>

            <input id="premium" type="radio" name="subscription" value="premium">
            <label for="premium">Premium</label>

            <input id="vip" type="radio" name="subscription" value="vip">
            <label for="vip">VIP</label>
        </div>
        <div>
            <input id="terms" type="checkbox" required>
            <label for="terms">I agree to the terms and condition</label>
        </div>
        <div>
            <label for="comments">Comments</label>
            <textarea id="comments" placeholder="Enter your comments" rows="4"></textarea>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>

</html>
