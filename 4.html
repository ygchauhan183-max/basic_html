<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background-color: #f4f6f8;
  color: #333;
  padding: 30px 15px;
}

h1 {
  text-align: center;
  color: #2c3e50;
  margin-bottom: 25px;
}

/* Scrolls sideways on small screens */
.table-wrap {
  max-width: 800px;
  margin: 0 auto;
  overflow-x: auto;
}

.styled-table {
  width: 100%;
  border-collapse: collapse;
  background-color: white;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
}

/* Table title */
.styled-table caption {
  font-size: 20px;
  font-weight: bold;
  color: #2c3e50;
  padding: 12px;
  caption-side: top;
}

/* Header */
.styled-table th {
  background-color: #2c3e50;
  color: white;
  text-align: left;
  padding: 12px 15px;
}

/* Cells */
.styled-table td {
  padding: 12px 15px;
  border-bottom: 1px solid #ddd;
}

/* Zebra stripes */
.styled-table tbody tr:nth-child(even) {
  background-color: #f4f6f8;
}

/* Row hover */
.styled-table tbody tr:hover {
  background-color: #dfeaf5;
}

/* No line under the last row */
.styled-table tbody tr:last-child td {
  border-bottom: none;
}</style>
<body>
    <h1>Table in HTML Tutorial</h1>

    <div class="table-wrap">
        <table class="styled-table">
            <caption>Student Reports</caption>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Student Number</th>
                    <th>Branch</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Yogesh</td>
                    <td>2616094</td>
                    <td>BCA 1st-Year</td>
                </tr>
                <tr>
                    <td>Rachit Pathak</td>
                    <td>2616011</td>
                    <td>BCA 1st-Year</td>
                </tr>
                <tr>
                    <td>Nikhil Nayal</td>
                    <td>2616085</td>
                    <td>BCA 1st-Year</td>
                </tr>
                <tr>
                    <td>Priyanshu Chauhan</td>
                    <td>2616080</td>
                    <td>BCA 1st-Year</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
